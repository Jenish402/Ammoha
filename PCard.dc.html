<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ammoha/tokens.css">
<link rel="stylesheet" href="ds/ammoha/components/bundle.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="site2.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:var(--font-sans)}</style>
</helmet>
<article class="am-stage {{ it.theme }}" data-pc style="--tint: {{ it.tint }}">
<span class="pc__stack" aria-hidden="true"></span>
<div class="pc__media">
<button class="pc__imgbtn" aria-label="{{ it.viewLabel }}" data-cursor="View" onClick="{{ it.open }}">
<span class="pc__plate" aria-hidden="true"></span>
<sc-if value="{{ it.hasImg }}" hint-placeholder-val="{{ true }}"><img class="pc__img" src="{{ it.img }}" alt="{{ it.name }}" loading="lazy" decoding="async"></sc-if>
<sc-if value="{{ it.hasAlt }}" hint-placeholder-val="{{ true }}"><span class="pc__alt" style="{{ it.altStyle }}" aria-hidden="true"></span></sc-if>
<sc-if value="{{ it.noImg }}" hint-placeholder-val="{{ false }}"><span class="ph" style="background: radial-gradient(circle at 35% 30%, #ffffff, {{ it.tint }} 75%)">{{ it.phText }}</span></sc-if>
<span class="pc__shine" aria-hidden="true"></span>
</button>
<sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="pc__badge">{{ it.badge }}</span></sc-if>
<button class="pc__wish wishbtn" aria-pressed="{{ it.wish }}" aria-label="{{ it.wishLabel }}" onClick="{{ it.toggle }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
<button class="pc__quick" aria-label="{{ it.quickLabel }}" onClick="{{ it.quick }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Quick view</span></button>
</div>
<div class="pc__body">
<div class="pc__meta"><span class="pc__cat">{{ it.cat }}</span><sc-if value="{{ it.hasVcount }}" hint-placeholder-val="{{ false }}"><span class="pc__vc">{{ it.vcount }}</span></sc-if></div>
<button class="pc__name" onClick="{{ it.open }}">{{ it.name }}</button>
<p class="pc__sub">{{ it.sub }}</p>
<div class="pc__dots"><sc-for list="{{ it.dots }}" as="d" hint-placeholder-count="3"><button class="pc__dot" style="--c: {{ d.c }}" title="{{ d.n }}" aria-label="{{ d.n }}" onClick="{{ d.go }}"></button></sc-for><sc-if value="{{ it.hasMore }}" hint-placeholder-val="{{ false }}"><span class="pc__more">{{ it.moreText }}</span></sc-if></div>
<div class="pc__foot"><div class="pc__price"><b>{{ it.priceText }}</b><sc-if value="{{ it.hasMrp }}" hint-placeholder-val="{{ true }}"><s>{{ it.mrpText }}</s><em>{{ it.offText }}</em></sc-if></div>
<button class="pc__add" data-fly onClick="{{ it.add }}"><span class="pc__add-t">{{ it.addLabel }}</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null,"default":null},"$preview":{"width":300,"height":520}}'>
class Component extends DCLogic {
renderVals() {
const noop = () => {};
const it = this.props.item || { theme: 'pc pc--lipstick has-alt', hasAlt: false, altStyle: '', hasVcount: true, vcount: '12 shades', quick: noop, quickLabel: 'Quick view', hasBadge: false, badge: '', wish: false, wishLabel: 'Save to wishlist', toggle: noop, viewLabel: 'View product', open: noop, hasImg: false, noImg: true, img: '', name: 'Siren Silk Matte Liquid Lipstick', phText: 'Photo coming soon', tint: '#f4b6c8', cat: 'Lips', sub: 'Smudge-proof, 12 shades', dots: [{ n: 'Velvet Orchid', c: '#a64d79', go: noop }, { n: 'Cocoa Craze', c: '#7a4033', go: noop }], hasMore: true, moreText: '+10', priceText: '₹699', hasMrp: true, mrpText: '₹999', offText: '30% off', add: noop, addLabel: 'Choose option' };
return { it };
}
}
</script>
</body>
</html>
